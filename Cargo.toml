[package]
name = "colored_text"
version = "0.6.0"
edition = "2021"
rust-version = "1.70.0"
description = "A simple library for adding colors and styles to terminal text"
repository = "https://github.com/seapagan/colored_text"
license = "MIT"
keywords = ["ansi", "color", "formatting", "terminal", "text"]
categories = ["command-line-utilities", "text-processing"]
exclude = [
  ".cargo/**",
  ".github/**",
  ".gitignore",
  ".vscode/**",
  "CONTRIBUTING.md",
  "Makefile.toml",
  "TODO.md",
  "deny.toml",
  "ruff.toml",
  "scripts/**",
  "tests/**",
]

[[example]]
name = "basic"
path = "examples/basic.rs"

[dependencies]

[dev-dependencies]
rstest = "0.24.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
